<!-- Estilos CSS Actualizados -->
  <style>
    :root {
      /* Colores base ajustados para el fondo Android oscuro */
      --bg-color-center: #1a2542; /* Azul muy oscuro en el centro */
      --bg-color-edge: #0b0f19;   /* Negro casi total en los bordes */
      
      --card-bg: rgba(16, 24, 48, 0.7); /* Tarjetas más translúcidas */
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-purple: #7b2cbf;
      --text-color: #ffffff;
      --admin-color: #ff0055;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      /* === AQUÍ ESTÁ EL TRUCO DEL FONDO ANDROID === */
      
      /* 1. Definimos los dos fondos: El patrón y el degradado */
      background-image: 
        url('pattern.png'), /* Reemplaza con tu archivo de imagen */
        radial-gradient(circle at center, var(--bg-color-center) 0%, var(--bg-color-edge) 70%);

      /* 2. Ajustamos cómo se comportan */
      background-repeat: repeat, no-repeat; /* El patrón se repite, el degradado no */
      background-position: center, center;
      background-size: auto, cover; /* El patrón mantiene su tamaño, el degradado cubre todo */
      background-attachment: fixed; /* Mantiene el fondo quieto al hacer scroll */

      /* 3. Mezclamos el patrón con el degradado para el efecto "soft glow" */
      background-blend-mode: overlay; /* O prueba 'soft-light' si es muy fuerte */
      
      /* === FIN DEL TRUCO === */

      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ... El resto del código CSS se mantiene igual ... */
    
    /* Navbar sutilmente translúcida */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: rgba(11, 15, 25, 0.8); /* Más transparente */
      border-bottom: 1px solid rgba(0, 242, 254, 0.1);
      backdrop-filter: blur(15px); /* Desenfoque del fondo */
      position: sticky;
      top: 0;
      z-index: 100;
    }

    /* ... (Resto de los estilos de la respuesta anterior) ... */
  </style>
