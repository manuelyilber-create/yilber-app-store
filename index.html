<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Survival 3D Profesional .IO</title>
    <link rel="stylesheet" href="style.css">
    <!-- Carga de Three.js y librerías necesarias -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <!-- Pantalla de Carga/Inicio -->
    <div id="loading-overlay">
        <div class="loader-content">
            <h1>SURVIVAL 3D</h1>
            <p id="loading-text">Cargando mundo perfecto...</p>
            <button id="start-btn" style="display:none;">INICIAR PARTIDA</button>
        </div>
    </div>

    <!-- HUD del Juego (Interfaz) -->
    <div id="hud" style="display:none;">
        <div id="leaderboard">
            <h3>Clasificación</h3>
            <div class="lb-row active"><span>Yilber</span> <span>0</span></div>
            <div class="lb-row"><span>Player#112</span> <span>150</span></div>
        </div>

        <div id="hotbar">
            <div class="slot active">🪓</div>
            <div class="slot">⛏️</div>
            <div class="slot">⚔️</div>
        </div>

        <!-- Controles Táctiles (Joysticks invisibles hasta tocar) -->
        <div id="joystick-zone">
            <div id="joystick-base">
                <div id="joystick-stick"></div>
            </div>
        </div>
        
        <button id="attack-btn">⚔️</button>
    </div>

    <!-- PUNTO DE ENTRADA DEL JUEGO -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
