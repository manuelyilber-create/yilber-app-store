<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STORE YILBER | Apps & PC</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(10, 15, 30, 0.85);
            --glass-border: rgba(56, 189, 248, 0.5);
            --cyan-glow: #38bdf8;
            --purple-glow: #a855f7;
            --green-glow: #22c55e;
            --text-light: #f1f5f9;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Rajdhani', sans-serif; 
        }

        body {
            /* FONDO CIBERNÉTICO */
            background-image: url('fondo-store.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #040814;
            color: var(--text-light);
            min-height: 100vh;
        }

        /* BARRA DE NAVEGACIÓN SUPERIOR */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background: rgba(4, 8, 20, 0.9);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--glass-border);
        }

        .nav-logo {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 1.4rem;
            color: var(--cyan-glow);
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
        }

        .btn-auth {
            background: linear-gradient(90deg, #38bdf8, #8b5cf6);
            color: #fff;
            border: none;
            padding: 0.6rem 1.4rem;
            border-radius: 25px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
            transition: 0.3s;
        }

        .btn-auth:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.8);
        }

        /* ENCABEZADO Y LOGO PRINCIPAL */
        .hero {
            text-align: center;
            padding: 2.5rem 1rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-container {
            max-width: 500px;
            width: 90%;
            margin-bottom: 1rem;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
            border: 1px solid var(--glass-border);
        }

        .hero p {
            color: #cbd5e1;
            font-size: 1.2rem;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(0,0,0,0.9);
        }

        /* CONTENEDOR PRINCIPAL */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 1rem 20px 50px;
        }

        /* PANEL DE ADMINISTRACIÓN */
        .admin-panel {
            background: var(--glass-bg);
            border: 1px solid var(--purple-glow);
            border-radius: 16px;
            padding: 1.5rem 2rem;
            margin-bottom: 2.5rem;
            backdrop-filter: blur(16px);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.3);
        }

        .admin-panel h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: var(--purple-glow);
            margin-bottom: 1.2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.5rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
            color: #a7f3d0;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.7rem;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            background: rgba(4, 8, 20, 0.9);
            color: #fff;
            outline: none;
            font-size: 0.95rem;
        }

        .btn-submit {
            background: linear-gradient(90deg, #a855f7, #38bdf8);
            color: #fff;
            border: none;
            padding: 0.8rem;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        .btn-submit:hover {
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.7);
        }

        /* SECCIONES Y TARJETAS */
        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            margin: 2rem 0 1rem;
            color: var(--green-glow); 
            text-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .app-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.2rem;
            backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: 0.3s;
        }

        .app-card:hover {
            border-color: var(--cyan-glow);
            transform: translateY(-5px);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
        }

        .app-card img {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            object-fit: cover;
            margin-bottom: 0.8rem;
            border: 1px solid var(--glass-border);
            box-shadow: 0 0 15px rgba(0,0,0,0.6);
        }

        .app-card h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            margin-bottom: 0.3rem;
        }

        .app-card .category {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }

        .btn-download {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid var(--cyan-glow);
            color: #fff;
            padding: 0.6rem 1.4rem;
            border-radius: 10px;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            transition: 0.3s;
            width: 100%;
            display: block;
        }

        .btn-download:hover {
            background: var(--cyan-glow);
            color: #040814;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.8);
        }

        /* VENTANA MODAL PARA INICIO DE SESIÓN */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #080f1e;
            border: 1px solid var(--cyan-glow);
            border-radius: 16px;
            padding: 2rem;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
            position: relative;
        }

        .modal-content h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--cyan-glow);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-logo">📡 STORE YILBER</div>
        <button class="btn-auth" onclick="toggleModal(true)">Iniciar Sesión / Registro</button>
    </nav>

    <div class="hero">
        <div class="logo-container">
            <img id="mainLogo" src="logo-store.png" alt="STORE YILBER" onerror="handleLogoError(this)">
        </div>
        <p>Descarga Software, Juegos y Apps Exclusivas</p>
    </div>

    <div class="container">
        
        <!-- PANEL DE ADMINISTRACIÓN -->
        <div class="admin-panel">
            <h2>⚙️ Panel de Administración (Subir App / Logo)</h2>
            <form id="uploadForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="appName">Nombre de la App / Programa:</label>
                        <input type="text" id="appName" placeholder="Ej: Yilber App Pro" required>
                    </div>
                    <div class="form-group">
                        <label for="appCategory">Categoría:</label>
                        <select id="appCategory">
                            <option value="Android (.APK)">📱 Android (.APK)</option>
                            <option value="Programa PC (.EXE)">💻 Programa PC (.EXE)</option>
                            <option value="Juego">🎮 Juego</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="appLogo">Logo / Imagen (.PNG, .JPG):</label>
                        <input type="file" id="appLogo" accept="image/*" required>
                    </div>
                    <div class="form-group">
                        <label for="appFile">Archivo (.APK, .EXE, .ZIP):</label>
                        <input type="file" id="appFile" accept=".apk,.exe,.zip,.rar" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Publicar en la Tienda</button>
            </form>
        </div>

        <!-- SECCIÓN DE APPS -->
        <div class="section-title">📱 Aplicaciones y Software Disponibles</div>
        <div class="app-grid" id="appGrid">
            <div class="app-card">
                <img src="logo-store.png" alt="App" onerror="this.onerror=null; this.src='https://via.placeholder.com/80/38bdf8/040814?text=YILBER';">
                <h3>Yilber App Premium</h3>
                <span class="category">Android (.APK)</span>
                <a href="#" class="btn-download">Descargar APK</a>
            </div>
        </div>

    </div>

    <!-- VENTANA DE INICIO DE SESIÓN / REGISTRO -->
    <div class="modal" id="authModal" onclick="closeModalOnOutsideClick(event)">
        <div class="modal-content">
            <span class="close-btn" onclick="toggleModal(false)">&times;</span>
            <h2>Iniciar Sesión</h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label for="loginEmail">Correo Electrónico:</label>
                    <input type="email" id="loginEmail" placeholder="usuario@correo.com" required>
                </div>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="loginPassword">Contraseña:</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">Entrar a Store Yilber</button>
            </form>
        </div>
    </div>

    <script>
        // Manejo del logo principal para evitar imágenes rotas
        function handleLogoError(img) {
            if (img.src.includes('logo-store.png')) {
                img.src = 'logo-yilber.png';
            } else {
                img.onerror = null;
                // Si ninguna imagen existe, muestra un gráfico SVG estilizado
                img.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="500" height="150" viewBox="0 0 500 150"><rect width="100%" height="100%" fill="%23080f1e" rx="16"/><text x="50%" y="55%" font-family="sans-serif" font-weight="bold" font-size="28" fill="%2338bdf8" text-anchor="middle" dominant-baseline="middle">STORE YILBER</text></svg>';
            }
        }

        // Abrir / Cerrar Modal de Inicio de Sesión
        function toggleModal(show) {
            const modal = document.getElementById('authModal');
            modal.style.display = show ? 'flex' : 'none';
        }

        function closeModalOnOutsideClick(event) {
            if (event.target.id === 'authModal') {
                toggleModal(false);
            }
        }

        // Manejo de Inicio de Sesión
        function handleLogin(event) {
            event.preventDefault();
            alert('¡Inicio de sesión exitoso!');
            toggleModal(false);
        }

        // Agregar nueva App a la cuadrícula desde el formulario
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('appName').value;
            const category = document.getElementById('appCategory').value;
            const logoInput = document.getElementById('appLogo');
            const fileInput = document.getElementById('appFile');

            if (logoInput.files && logoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const logoSrc = e.target.result;
                    const fileName = fileInput.files[0] ? fileInput.files[0].name : 'archivo';

                    const appCardHTML = `
                        <div class="app-card">
                            <img src="${logoSrc}" alt="${name}">
                            <h3>${name}</h3>
                            <span class="category">${category}</span>
                            <a href="#" class="btn-download" onclick="alert('Iniciando descarga de: ${fileName}')">Descargar</a>
                        </div>
                    `;

                    document.getElementById('appGrid').insertAdjacentHTML('beforeend', appCardHTML);
                    document.getElementById('uploadForm').reset();
                    alert('¡App publicada con éxito en la tienda!');
                };
                reader.readAsDataURL(logoInput.files[0]);
            }
        });
    </script>
</body>
</html>
