<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STORE YILBER - Apps & Software</title>
  
  <!-- Estilos CSS -->
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(16, 24, 48, 0.85);
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-purple: #7b2cbf;
      --text-color: #ffffff;
      --admin-color: #ff0055;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      background-image: radial-gradient(circle at 50% 50%, #151d36 0%, #0b0f19 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: rgba(11, 15, 25, 0.9);
      border-bottom: 1px solid rgba(0, 242, 254, 0.2);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: bold;
      background: linear-gradient(45deg, var(--accent-cyan), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .user-controls {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .btn {
      padding: 8px 18px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(45deg, var(--accent-blue), var(--accent-cyan));
      color: #000;
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
    }

    .btn-primary:hover {
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.8);
      transform: translateY(-2px);
    }

    .btn-danger {
      background: #ff3366;
      color: white;
    }

    /* Contenido Principal */
    main {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
      width: 100%;
      flex: 1;
    }

    .hero {
      text-align: center;
      margin-bottom: 3rem;
    }

    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
    }

    .hero p {
      color: #a0aec0;
    }

    /* Secciones de Apps */
    .section-title {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      border-left: 4px solid var(--accent-cyan);
      padding-left: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 3rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      backdrop-filter: blur(4px);
      transition: transform 0.3s ease, border-color 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-cyan);
    }

    .card h3 {
      color: var(--accent-cyan);
      margin-bottom: 5px;
    }

    .card p {
      font-size: 0.9rem;
      color: #cbd5e0;
      margin-bottom: 15px;
    }

    .card .version {
      font-size: 0.8rem;
      color: #718096;
      margin-bottom: 10px;
    }

    /* PANEL DE ADMINISTRADOR (Oculto por defecto) */
    #admin-panel {
      display: none;
      background: rgba(255, 0, 85, 0.05);
      border: 2px dashed var(--admin-color);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    #admin-panel h2 {
      color: var(--admin-color);
      margin-bottom: 1rem;
    }

    .admin-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .admin-form input, .admin-form select {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #1a202c;
      color: white;
    }

    .admin-form button {
      grid-column: span 2;
      background: var(--admin-color);
      color: white;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    /* Modal Autenticación */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #1a202c;
      padding: 2rem;
      border-radius: 12px;
      width: 350px;
      border: 1px solid var(--accent-cyan);
    }

    .modal-content h2 {
      margin-bottom: 1rem;
      text-align: center;
    }

    .modal-content input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #2d3748;
      color: white;
    }

    .modal-content .switch-mode {
      text-align: center;
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--accent-blue);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Encabezado -->
  <header>
    <div class="logo">STORE YILBER</div>
    <div class="user-controls">
      <span id="user-display" style="display:none; font-size: 0.9rem;"></span>
      <button id="auth-btn" class="btn btn-primary" onclick="openModal()">Iniciar Sesión / Registro</button>
      <button id="logout-btn" class="btn btn-danger" style="display:none;" onclick="logout()">Cerrar Sesión</button>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main>
    <div class="hero">
      <h1>Descarga Software y Apps Exclusivas</h1>
      <p>Proyectos para Android (APK) y Windows (PC)</p>
    </div>

    <!-- PANEL DE CONTROL SOLO PARA EL ADMIN -->
    <section id="admin-panel">
      <h2>⚡ Panel de Administración (Vista Exclusiva)</h2>
      <form class="admin-form" id="add-app-form">
        <input type="text" id="app-name" placeholder="Nombre de la App/Programa" required>
        <select id="app-type" required>
          <option value="android">Aplicación Android (APK)</option>
          <option value="pc">Programa PC (Windows)</option>
        </select>
        <input type="text" id="app-version" placeholder="Versión (ej: 1.0)" required>
        <input type="url" id="app-link" placeholder="Enlace de Descarga (URL)" required>
        <input type="text" id="app-desc" placeholder="Descripción corta" style="grid-column: span 2;" required>
        <button type="submit">Añadir Nuevo Software</button>
      </form>
    </section>

    <!-- Sección Android -->
    <h2 class="section-title">📱 Aplicaciones Android (APK)</h2>
    <div class="app-grid" id="android-list">
      <!-- Apps cargadas dinámicamente -->
    </div>

    <!-- Sección PC -->
    <h2 class="section-title">💻 Programas PC (Microsoft)</h2>
    <div class="app-grid" id="pc-list">
      <!-- Programas cargados dinámicamente -->
    </div>
  </main>

  <!-- Modal de Login / Registro -->
  <div class="modal" id="auth-modal">
    <div class="modal-content">
      <h2 id="modal-title">Iniciar Sesión</h2>
      <input type="email" id="auth-email" placeholder="Correo Electrónico">
      <input type="password" id="auth-pass" placeholder="Contraseña">
      <button id="auth-action-btn" class="btn btn-primary" style="width: 100%; margin-top: 10px;" onclick="handleAuth()">Entrar</button>
      <div class="switch-mode" onclick="toggleAuthMode()" id="switch-text">¿No tienes cuenta? Regístrate aquí</div>
      <button class="btn" style="width: 100%; margin-top: 10px; background: transparent; color: #aaa;" onclick="closeModal()">Cancelar</button>
    </div>
  </div>

  <!-- Firebase Scripts (v9 Modular SDK via CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ⚠️ REEMPLAZA ESTA CONFIGURACIÓN CON LA DE TU PROYECTO DE FIREBASE
    const firebaseConfig = {
      apiKey: "TU_API_KEY_AQUI",
      authDomain: "TU_PROYECTO.firebaseapp.com",
      projectId: "TU_PROYECTO_ID",
      storageBucket: "TU_PROYECTO.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let isRegisterMode = false;

    // Abrir/Cerrar Modal
    window.openModal = () => document.getElementById('auth-modal').style.display = 'flex';
    window.closeModal = () => document.getElementById('auth-modal').style.display = 'none';

    window.toggleAuthMode = () => {
      isRegisterMode = !isRegisterMode;
      document.getElementById('modal-title').innerText = isRegisterMode ? 'Crear Cuenta' : 'Iniciar Sesión';
      document.getElementById('auth-action-btn').innerText = isRegisterMode ? 'Registrarme' : 'Entrar';
      document.getElementById('switch-text').innerText = isRegisterMode ? '¿Ya tienes cuenta? Inicia sesión' : '¿No tienes cuenta? Regístrate aquí';
    };

    // Manejar Registro / Login
    window.handleAuth = async () => {
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-pass').value;

      if (!email || !pass) return alert('Por favor llena todos los campos.');

      try {
        if (isRegisterMode) {
          // Registrar nuevo usuario
          const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
          const user = userCredential.user;

          // Guardar en la base de datos Firestore (Por defecto rol 'user')
          await setDoc(doc(db, "users", user.uid), {
            email: user.email,
            role: "user",
            createdAt: new Date()
          });
          alert('¡Cuenta registrada exitosamente!');
        } else {
          // Iniciar sesión
          await signInWithEmailAndPassword(auth, email, pass);
        }
        closeModal();
      } catch (error) {
        alert("Error: " + error.message);
      }
    };

    // Cerrar Sesión
    window.logout = () => signOut(auth);

    // Escuchar el Estado de la Sesión (Determina si es Admin o Usuario)
    onAuthStateChanged(auth, async (user) => {
      const userDisplay = document.getElementById('user-display');
      const authBtn = document.getElementById('auth-btn');
      const logoutBtn = document.getElementById('logout-btn');
      const adminPanel = document.getElementById('admin-panel');

      if (user) {
        userDisplay.style.display = 'inline';
        userDisplay.innerText = `👤 ${user.email}`;
        authBtn.style.display = 'none';
        logoutBtn.style.display = 'inline-block';

        // Verificar el Rol en Firestore
        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (userDoc.exists() && userDoc.data().role === 'admin') {
          adminPanel.style.display = 'block'; // Muestra panel si es Admin
        } else {
          adminPanel.style.display = 'none';
        }
      } else {
        userDisplay.style.display = 'none';
        authBtn.style.display = 'inline-block';
        logoutBtn.style.display = 'none';
        adminPanel.style.display = 'none';
      }
    });

    // Añadir nuevo programa (Función de Admin)
    document.getElementById('add-app-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await addDoc(collection(db, "downloads"), {
          name: document.getElementById('app-name').value,
          type: document.getElementById('app-type').value,
          version: document.getElementById('app-version').value,
          link: document.getElementById('app-link').value,
          desc: document.getElementById('app-desc').value,
          createdAt: new Date()
        });
        alert('¡Programa publicado con éxito!');
        document.getElementById('add-app-form').reset();
      } catch (err) {
        alert('Error al publicar: ' + err.message);
      }
    });

    // Cargar Aplicaciones en tiempo real desde Firestore
    onSnapshot(collection(db, "downloads"), (snapshot) => {
      const androidList = document.getElementById('android-list');
      const pcList = document.getElementById('pc-list');

      androidList.innerHTML = '';
      pcList.innerHTML = '';

      snapshot.forEach((doc) => {
        const item = doc.data();
        const cardHtml = `
          <div class="card">
            <div>
              <h3>${item.name}</h3>
              <div class="version">Versión ${item.version}</div>
              <p>${item.desc}</p>
            </div>
            <a href="${item.link}" target="_blank" class="btn btn-primary" style="text-align:center; text-decoration:none;">Descargar</a>
          </div>
        `;

        if (item.type === 'android') {
          androidList.innerHTML += cardHtml;
        } else {
          pcList.innerHTML += cardHtml;
        }
      });
    });
  </script>
</body>
</html>
