<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lostminer 3D Clone - Perfecto</title>
    <link rel="stylesheet" href="style.css">
    <!-- Three.js Base -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <!-- UI Overlay: Pantalla de Carga/Menú -->
    <div id="loading-overlay">
        <div class="loader-content">
            <h1>LOSTMINER 3D</h1>
            <p id="loading-text">Generando mundo procedural...</p>
            <button id="start-btn" style="display:none;">EMPEZAR AVENTURA</button>
        </div>
    </div>

    <!-- HUD de Juego -->
    <div id="hud" style="display:none;">
        <!-- Clasificación -->
        <div id="leaderboard">
            <h3>Top Mineros</h3>
            <div class="lb-row active"><span>Yilber</span> <span>0 m</span></div>
            <div class="lb-row"><span>Bot1</span> <span>15 m</span></div>
        </div>

        <!-- Hotbar (Inventario Rápido) -->
        <div id="hotbar">
            <div class="slot active" data-item="pickaxe">⛏️</div>
            <div class="slot" data-item="block_dirt">🟫</div>
            <div class="slot" data-item="torch">🔦</div>
        </div>

        <!-- Zonas de Control Táctil (Joysticks) -->
        <div id="action-zones">
            <div id="joystick-region"></div>
            <div id="mine-btn">⛏️ <span class="btn-desc">MINAR</span></div>
            <div id="jump-btn">⬆️</div>
        </div>
    </div>

    <!-- PUNTO DE ENTRADA MODULAR -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
