<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terraria Mobile Edition</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: monospace;
            margin: 0; padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #4ba3e3 0%, #7ec0ee 50%, #5992c2 100%);
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 100%;
            height: 100%;
        }
        /* HUD Superior Estilo Oficial */
        .top-hud {
            position: absolute;
            top: 10px; left: 10px; right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 20;
        }
        .hotbar {
            display: flex;
            gap: 4px;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px;
            border-radius: 4px;
            pointer-events: auto;
        }
        .slot {
            width: 38px; height: 38px;
            background: rgba(30, 60, 90, 0.6);
            border: 2px solid #557799;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            position: relative;
        }
        .slot.active { border-color: #e5e525; background: rgba(60, 100, 140, 0.8); }
        .slot span { font-size: 10px; position: absolute; bottom: 1px; right: 3px; color: #fff; text-shadow: 1px 1px #000; }

        .hearts-container {
            display: flex;
            gap: 3px;
            background: rgba(0,0,0,0.2);
            padding: 6px;
            border-radius: 6px;
            pointer-events: auto;
        }
        .heart { font-size: 16px; filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.8)); }

        /* Controles Táctiles en Pantalla (Estilo Mobile) */
        .controls-layer {
            position: absolute;
            bottom: 0; left: 0; right: 0; top: 0;
            pointer-events: none;
            z-index: 20;
        }
        /* Joystick de Movimiento Izquierdo */
        .joystick-base {
            position: absolute;
            bottom: 30px; left: 30px;
            width: 110px; height: 110px;
            background: rgba(0, 0, 0, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .joystick-knob {
            width: 50px; height: 50px;
            background: rgba(80, 140, 200, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            position: absolute;
        }
        /* Botones Derechos (Salto y Acción) */
        .action-buttons {
            position: absolute;
            bottom: 30px; right: 30px;
            display: flex;
            gap: 15px;
            align-items: flex-end;
            pointer-events: auto;
        }
        .mob-btn {
            width: 60px; height: 60px;
            background: rgba(40, 90, 140, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            color: white;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .mob-btn:active { background: rgba(80, 150, 220, 0.8); transform: scale(0.95); }
        .jump-btn { width: 65px; height: 65px; background: rgba(50, 150, 50, 0.5); }
        .tool-btn { width: 55px; height: 55px; background: rgba(180, 90, 30, 0.5); }
    </style>
</head>
<body>

<div id="gameContainer">
    <div class="top-hud">
        <div class="hotbar" id="hotbar"></div>
        <div class="hearts-container" id="heartsContainer"></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="controls-layer">
        <div class="joystick-base" id="joystickBase">
            <div class="joystick-knob" id="joystickKnob"></div>
        </div>
        <div class="action-buttons">
            <div class="mob-btn tool-btn" id="btnAction">⛏️</div>
            <div class="mob-btn jump-btn" id="btnJump">⏫</div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const tileSize = 24;
    const worldCols = 200;
    const worldRows = 80;
    let world = [];

    let player = {
        x: 400, y: 300,
        width: 20, height: 38,
        vx: 0, vy: 0,
        speed: 3.2, jumpForce: -9.5, gravity: 0.45,
        grounded: false,
        hp: 100, maxHp: 100,
        facing: 1, selectedSlot: 0
    };

    let inventory = [
        { id: 'pickaxe', name: 'Pico', icon: '⛏️', type: 'tool' },
        { id: 'axe', name: 'Hacha', icon: '🪓', type: 'tool' },
        { id: 'sword', name: 'Espada', icon: '🗡️', type: 'weapon' },
        { id: 'dirt', name: 'Tierra', icon: '🟫', type: 'block', count: 99 },
        { id: 'wood', name: 'Madera', icon: '🪵', type: 'block', count: 50 }
    ];

    // Generar mundo estilo Terraria (Superficie, Pasto, Tierra, Piedra y Árboles)
    function generateWorld() {
        world = [];
        let surfaceHeight = 35;
        for (let r = 0; r < worldRows; r++) {
            let row = [];
            for (let c = 0; c < worldCols; c++) {
                // Ondulación del terreno
                if (c % 15 === 0) surfaceHeight += Math.floor(Math.random() * 3) - 1;
                surfaceHeight = Math.max(28, Math.min(42, surfaceHeight));

                if (r < surfaceHeight) {
                    row.push(0); // Aire / Cielo
                } else if (r === surfaceHeight) {
                    row.push(2); // Bloque de Pasto
                } else if (r > surfaceHeight && r < surfaceHeight + 12) {
                    row.push(1); // Bloque de Tierra
                } else {
                    row.push(3); // Bloque de Piedra
                }
            }
            world.push(row);
        }
    }

    // Dibujar gráficos pixel art detallados simulando texturas oficiales
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let camX = player.x - canvas.width / 2;
        let camY = player.y - canvas.height / 2;
        
        // Limites de cámara
        camX = Math.max(0, Math.min(camX, (worldCols * tileSize) - canvas.width));
        camY = Math.max(0, Math.min(camY, (worldRows * tileSize) - canvas.height));

        ctx.save();
        ctx.translate(-camX, -camY);

        // Renderizar bloques del mundo
        let startCol = Math.floor(camX / tileSize);
        let endCol = startCol + Math.ceil(canvas.width / tileSize) + 1;
        let startRow = Math.floor(camY / tileSize);
        let endRow = startRow + Math.ceil(canvas.height / tileSize) + 1;

        for (let r = startRow; r < Math.min(worldRows, endRow); r++) {
            for (let c = startCol; c < Math.min(worldCols, endCol); c++) {
                let type = world[r][c];
                if (type !== 0) {
                    let bx = c * tileSize;
                    let by = r * tileSize;
                    if (type === 1) { // Tierra
                        ctx.fillStyle = "#8b5a2b"; ctx.fillRect(bx, by, tileSize, tileSize);
                        ctx.fillStyle = "#654321"; ctx.fillRect(bx+4, by+4, 6, 6); ctx.fillRect(bx+14, by+14, 6, 6);
                    } else if (type === 2) { // Pasto
                        ctx.fillStyle = "#8b5a2b"; ctx.fillRect(bx, by, tileSize, tileSize);
                        ctx.fillStyle = "#3b993b"; ctx.fillRect(bx, by, tileSize, 8); // Tapa verde
                        ctx.fillStyle = "#2d7a2d"; ctx.fillRect(bx+2, by+8, 4, 3); ctx.fillRect(bx+12, by+8, 6, 3);
                    } else if (type === 3) { // Piedra
                        ctx.fillStyle = "#6b7a8f"; ctx.fillRect(bx, by, tileSize, tileSize);
                        ctx.fillStyle = "#4a5568"; ctx.fillRect(bx+4, by+6, 8, 6);
                    }
                }
            }
        }

        // Renderizar Personaje Estilo Terraria (Cabello castaño, camisa gris, pantalones azules)
        let px = player.x;
        let py = player.y;
        
        // Sombra o cuerpo base
        ctx.fillStyle = "#d29062"; ctx.fillRect(px + 4, py + 2, 12, 10); // Cabeza
        ctx.fillStyle = "#8b4513"; ctx.fillRect(px + 3, py, 14, 4);   // Cabello
        ctx.fillStyle = "#6688aa"; ctx.fillRect(px + 3, py + 12, 14, 16); // Camisa
        ctx.fillStyle = "#334466"; ctx.fillRect(px + 4, py + 28, 5, 10);  // Pierna izq
        ctx.fillStyle = "#334466"; ctx.fillRect(px + 11, py + 28, 5, 10); // Pierna der

        ctx.restore();
    }

    // Colisiones precisas
    function checkCollision(nx, ny, w, h) {
        let left = Math.floor(nx / tileSize);
        let right = Math.floor((nx + w - 1) / tileSize);
        let top = Math.floor(ny / tileSize);
        let bottom = Math.floor((ny + h - 1) / tileSize);

        if (left < 0 || right >= worldCols || top < 0 || bottom >= worldRows) return true;
        for (let r = top; r <= bottom; r++) {
            for (let c = left; c <= right; c++) {
                if (world[r] && world[r][c] !== 0) return true;
            }
        }
        return false;
    }

    // Controles táctiles de movimiento con Joystick flotante
    let moveDir = 0;
    const joystickBase = document.getElementById("joystickBase");
    const joystickKnob = document.getElementById("joystickKnob");
    let joystickCenter = { x: 0, y: 0 };
    let touchId = null;

    joystickBase.addEventListener("touchstart", (e) => {
        let touch = e.changedTouches[0];
        touchId = touch.identifier;
        let rect = joystickBase.getBoundingClientRect();
        joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    });

    window.addEventListener("touchmove", (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
            let touch = e.changedTouches[i];
            if (touch.identifier === touchId) {
                let dx = touch.clientX - joystickCenter.x;
                let dist = Math.hypot(dx, touch.clientY - joystickCenter.y);
                let maxDist = 35;
                let angle = Math.atan2(touch.clientY - joystickCenter.y, touch.clientX - joystickCenter.x);
                
                let kx = Math.cos(angle) * Math.min(dist, maxDist);
                let ky = Math.sin(angle) * Math.min(dist, maxDist);
                joystickKnob.style.transform = `translate(${kx}px, ${ky}px)`;

                moveDir = dx > 10 ? 1 : (dx < -10 ? -1 : 0);
                if (dx > 5) player.facing = 1;
                if (dx < -5) player.facing = -1;
            }
        }
    });

    window.addEventListener("touchend", (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === touchId) {
                touchId = null;
                moveDir = 0;
                joystickKnob.style.transform = `translate(0px, 0px)`;
            }
        }
    });

    // Botón Salto
    document.getElementById("btnJump").addEventListener("touchstart", (e) => {
        e.preventDefault();
        if (player.grounded) {
            player.vy = player.jumpForce;
            player.grounded = false;
        }
    });

    // Botón Acción / Minar / Construir
    document.getElementById("btnAction").addEventListener("touchstart", (e) => {
        e.preventDefault();
        let item = inventory[player.selectedSlot];
        let tx = Math.floor((player.x + (player.facing * 30)) / tileSize);
        let ty = Math.floor((player.y + 20) / tileSize);

        if (tx >= 0 && tx < worldCols && ty >= 0 && ty < worldRows) {
            if (item.type === 'tool' || item.type === 'weapon') {
                if (world[ty][tx] !== 0) world[ty][tx] = 0; // Romper bloque
            } else if (item.type === 'block') {
                if (world[ty][tx] === 0 && item.count > 0) {
                    world[ty][tx] = item.id === 'dirt' ? 1 : 2;
                    item.count--;
                    renderHotbar();
                }
            }
        }
    });

    // Actualizar HUD superior (Corazones e Inventario)
    function renderHotbar() {
        const hb = document.getElementById("hotbar");
        hb.innerHTML = '';
        inventory.forEach((item, i) => {
            let slot = document.createElement("div");
            slot.className = `slot ${i === player.selectedSlot ? 'active' : ''}`;
            slot.innerHTML = `<span>${item.icon}</span>${item.count !== undefined ? `<span>${item.count}</span>` : ''}`;
            slot.onclick = () => { player.selectedSlot = i; renderHotbar(); };
            hb.appendChild(slot);
        });
    }

    function renderHearts() {
        const hc = document.getElementById("heartsContainer");
        hc.innerHTML = '';
        let heartsCount = Math.ceil(player.hp / 20);
        for (let i = 0; i < 5; i++) {
            let h = document.createElement("div");
            h.className = "heart";
            h.innerHTML = i < heartsCount ? "❤️" : "🖤";
            hc.appendChild(h);
        }
    }

    // Bucle principal de físicas y juego
    function update() {
        player.vx = moveDir * player.speed;

        // Físicas X
        player.x += player.vx;
        if (checkCollision(player.x, player.y, player.width, player.height)) {
            player.x -= player.vx;
        }

        // Físicas Y (Gravedad)
        player.vy += player.gravity;
        player.y += player.vy;
        player.grounded = false;
        if (checkCollision(player.x, player.y, player.width, player.height)) {
            player.y -= player.vy;
            if (player.vy > 0) player.grounded = true;
            player.vy = 0;
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    generateWorld();
    renderHotbar();
    renderHearts();
    loop();
</script>
</body>
</html>
