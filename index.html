<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Survival 3D - Online .IO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        #gameCanvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Pantalla de Inicio (Menu) */
        #menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #menu-card {
            background: #1e293b;
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            border: 2px solid #3b82f6;
            max-width: 90%;
            width: 360px;
        }

        #menu-card h1 {
            color: #fff;
            font-size: 28px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        #menu-card p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }

        #nickname-input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
            text-align: center;
        }

        #nickname-input:focus {
            border-color: #3b82f6;
        }

        #start-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #22c55e;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4);
            transition: transform 0.1s;
        }

        #start-btn:active {
            transform: scale(0.98);
        }

        /* HUD e Interfaz del Juego */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
        }

        #score-display {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 3px 8px rgba(0,0,0,0.8);
        }

        #leaderboard {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(8px);
            padding: 12px 16px;
            border-radius: 12px;
            color: white;
            min-width: 160px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        #leaderboard h3 {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .lb-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 600;
        }

        /* Controles Táctiles Joysticks */
        #touch-controls {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: auto;
        }

        .joystick-base {
            position: absolute;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            bottom: 40px;
            display: none;
        }

        #joystick-left {
            left: 40px;
        }

        .joystick-stick {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            top: 35px;
            left: 35px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        #attack-btn {
            position: absolute;
            bottom: 45px;
            right: 40px;
            width: 90px;
            height: 90px;
            background: rgba(239, 68, 68, 0.8);
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.5);
            pointer-events: auto;
        }

        #attack-btn:active {
            transform: scale(0.9);
            background: rgba(220, 38, 38, 1);
        }

        /* Hotbar */
        #hotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }

        .slot {
            width: 55px;
            height: 55px;
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .slot.active {
            border-color: #f59e0b;
            transform: scale(1.08);
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.5);
        }
    </style>
    <!-- Three.js CDN Directo -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <!-- Menu Principal -->
    <div id="menu-overlay">
        <div id="menu-card">
            <h1>SURVIVAL 3D</h1>
            <p>Supervivencia Online .IO</p>
            <input type="text" id="nickname-input" placeholder="Tu Nombre..." value="Yilber" maxlength="12">
            <button id="start-btn">INICIAR PARTIDA</button>
        </div>
    </div>

    <!-- HUD de Juego -->
    <div id="hud">
        <div id="score-display"><span id="score">0</span></div>

        <div id="leaderboard">
            <h3>Clasificación</h3>
            <div class="lb-row"><span id="lb-name">Yilber</span> <span id="lb-score">0</span></div>
            <div class="lb-row" style="color: #64748b;"><span>Player#8821</span> <span>1200</span></div>
            <div class="lb-row" style="color: #64748b;"><span>Bot_Alfa</span> <span>450</span></div>
        </div>

        <div id="hotbar">
            <div class="slot active">🪓</div>
            <div class="slot">⛏️</div>
            <div class="slot">⚔️</div>
            <div class="slot">🏹</div>
        </div>

        <!-- Controles Móviles -->
        <div id="touch-controls">
            <div id="joystick-left" class="joystick-base">
                <div id="joystick-stick" class="joystick-stick"></div>
            </div>
            <div id="attack-btn">⚔️</div>
        </div>
    </div>

    <script>
        // --- MOTOR 3D Y LÓGICA PRINCIPAL DEL JUEGO ---
        let scene, camera, renderer, playerGroup, groundManager;
        let gameActive = false;
        let score = 0;

        // Elementos UI
        const menuOverlay = document.getElementById('menu-overlay');
        const hud = document.getElementById('hud');
        const startBtn = document.getElementById('start-btn');
        const scoreTxt = document.getElementById('score');
        const lbScore = document.getElementById('lb-score');
        const lbName = document.getElementById('lb-name');
        const nickInput = document.getElementById('nickname-input');

        // Inicialización de la Escena 3D
        function init3D() {
            const canvas = document.getElementById('gameCanvas');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Cielo
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.012);

            renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // Cámara Isométrica estilo .IO
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            // Iluminación
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const sun = new THREE.DirectionalLight(0xfff7e6, 1.2);
            sun.position.set(25, 40, 20);
            sun.castShadow = true;
            sun.shadow.mapSize.width = 1024;
            sun.shadow.mapSize.height = 1024;
            scene.add(sun);

            // Crear Terreno
            createTerrain();

            // Crear Personaje 3D Visible
            createPlayer();

            // Redimensionado de pantalla
            window.addEventListener('resize', onWindowResize);
        }

        function createTerrain() {
            // Suelo Verde Realista
            const groundGeo = new THREE.PlaneGeometry(100, 100);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x48bb78, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Cuadrícula táctica estilo .io
            const grid = new THREE.GridHelper(100, 40, 0x38a169, 0x38a169);
            grid.position.y = 0.01;
            scene.add(grid);

            // Rocas y Recursos 3D
            const rockGeo = new THREE.DodecahedronGeometry(1.2, 1);
            const rockMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.7 });

            for (let i = 0; i < 20; i++) {
                const rock = new THREE.Mesh(rockGeo, rockMat);
                rock.position.set(
                    (Math.random() - 0.5) * 70,
                    0.8,
                    (Math.random() - 0.5) * 70
                );
                rock.castShadow = true;
                rock.receiveShadow = true;
                scene.add(rock);
            }
        }

        function createPlayer() {
    playerGroup = new THREE.Group();

    // Cuerpo del jugador
    const bodyGeo = new THREE.SphereGeometry(1, 32, 32);
    // ... (habrá más líneas aquí adentro) ...
    rightHand.castShadow = true;
    playerGroup.add(rightHand);

    scene.add(playerGroup);

            // Manos
            const handGeo = new THREE.SphereGeometry(0.35, 16, 16);
            const handMat = new THREE.MeshStandardMaterial({ color: 0xe11d48 });

            const leftHand = new THREE.Mesh(handGeo, handMat);
            leftHand.position.set(-0.8, 0.9, 0.6);
            leftHand.castShadow = true;
            playerGroup.add(leftHand);

            const rightHand = new THREE.Mesh(handGeo, handMat);
            rightHand.position.set(0.8, 0.9, 0.6);
            rightHand.castShadow = true;
            playerGroup.add(rightHand);

            scene.add(playerGroup);
        }

        // --- SISTEMA DE CONTROLES (TECLADO + TÁCTIL) ---
        const keys = {};
        let moveX = 0;
        let moveZ = 0;

        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        // Lógica de Joystick Táctil
        const touchZone = document.getElementById('touch-controls');
        const joystickLeft = document.getElementById('joystick-left');
        const joystickStick = document.getElementById('joystick-stick');
        let touchStartPos = { x: 0, y: 0 };
        let isTouching = false;

        touchZone.addEventListener('touchstart', (e) => {
            if (!gameActive) return;
            for (let touch of e.changedTouches) {
                // Si el toque es en el lado izquierdo de la pantalla
                if (touch.clientX < window.innerWidth / 2) {
                    isTouching = true;
                    touchStartPos = { x: touch.clientX, y: touch.clientY };
                    joystickLeft.style.display = 'block';
                    joystickLeft.style.left = (touch.clientX - 60) + 'px';
                    joystickLeft.style.top = (touch.clientY - 60) + 'px';
                    joystickStick.style.transform = `translate(0px, 0px)`;
                }
            }
        });

        touchZone.addEventListener('touchmove', (e) => {
            if (!isTouching) return;
            for (let touch of e.touches) {
                if (touch.clientX < window.innerWidth / 2) {
                    let dx = touch.clientX - touchStartPos.x;
                    let dy = touch.clientY - touchStartPos.y;
                    let dist = Math.hypot(dx, dy);
                    let maxDist = 40;

                    if (dist > maxDist) {
                        dx = (dx / dist) * maxDist;
                        dy = (dy / dist) * maxDist;
                    }

                    joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;
                    moveX = dx / maxDist;
                    moveZ = dy / maxDist;
                }
            }
        });

        const endTouch = () => {
            isTouching = false;
            joystickLeft.style.display = 'none';
            moveX = 0;
            moveZ = 0;
        };

        touchZone.addEventListener('touchend', endTouch);
        touchZone.addEventListener('touchcancel', endTouch);

        // Ataque
        const attackBtn = document.getElementById('attack-btn');
        attackBtn.addEventListener('click', performAttack);
        attackBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            performAttack();
        });

        function performAttack() {
            if (!gameActive) return;
            score += 10;
            scoreTxt.innerText = score;
            lbScore.innerText = score;

            // Animación rápida de golpe
            playerGroup.position.y = 0.3;
            setTimeout(() => playerGroup.position.y = 0, 100);
        }

        // --- INICIAR JUEGO ---
        startBtn.addEventListener('click', () => {
            const name = nickInput.value.trim() || "Yilber";
            lbName.innerText = name;
            menuOverlay.style.display = 'none';
            hud.style.display = 'block';
            gameActive = true;
        });

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- BUCLE PRINCIPAL (ANIMACIÓN Y FÍSICAS) ---
        const clock = new THREE.Clock();
        const cameraOffset = new THREE.Vector3(0, 16, 12);

        function animate() {
            requestAnimationFrame(animate);

            const deltaTime = clock.getDelta();

            if (gameActive) {
                // Cálculo de movimiento teclado + joystick
                let dx = 0;
                let dz = 0;

                if (keys['w'] || keys['arrowup']) dz -= 1;
                if (keys['s'] || keys['arrowdown']) dz += 1;
                if (keys['a'] || keys['arrowleft']) dx -= 1;
                if (keys['d'] || keys['arrowright']) dx += 1;

                if (moveX !== 0 || moveZ !== 0) {
                    dx = moveX;
                    dz = moveZ;
                }

                if (Math.abs(dx) > 0.1 || Math.abs(dz) > 0.1) {
                    const speed = 10 * deltaTime;
                    playerGroup.position.x += dx * speed;
                    playerGroup.position.z += dz * speed;

                    // Rotar hacia la dirección de movimiento
                    const angle = Math.atan2(dx, dz);
                    playerGroup.rotation.y = angle;
                }

                // Posicionamiento de cámara dinámica
                camera.position.x = playerGroup.position.x + cameraOffset.x;
                camera.position.y = playerGroup.position.y + cameraOffset.y;
                camera.position.z = playerGroup.position.z + cameraOffset.z;
                camera.lookAt(playerGroup.position);
            }

            renderer.render(scene, camera);
        }

        // Inicializar al cargar ventana
        window.onload = () => {
            init3D();
            animate();
        };
    </script>
</body>
</html>
