<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Survival 3D Ultra Real</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <!-- Interfaz de Usuario UI (Leaderboard, Inventario, Controles) -->
    <div id="ui-container">
        <div id="score-display">PUNTOS: <span id="score">0</span></div>
        
        <div id="leaderboard">
            <h3>Top Jugadores</h3>
            <ol id="leaderboard-list">
                <li><span>Tú</span> <span id="player-score">0</span></li>
            </ol>
        </div>

        <div id="hotbar">
            <div class="slot active" data-item="axe">🪓</div>
            <div class="slot" data-item="pickaxe">⛏️</div>
            <div class="slot" data-item="sword">⚔️</div>
            <div class="slot" data-item="bow">🏹</div>
        </div>
    </div>

    <!-- Carga de Librería Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
